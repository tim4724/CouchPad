apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: couch-games-site

resources:
  - deployment.yaml

# CI rewrites newTag on every release with:
#   kustomize edit set image ghcr.io/tim4724/couch-games=<repo>:<tag>
# Committed as `latest` only so `kubectl apply -k deploy/` is runnable by hand.
images:
  - name: ghcr.io/tim4724/couch-games
    newTag: latest
