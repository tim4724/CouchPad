<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CouchPad">
  <!-- The gamepad mark, matching the launcher app icon (Couch-Games-Controller
       ios/CouchPad/AppIcon.icon/Assets/controller.svg): same silhouette, same -8°
       tilt. The body sits tighter in the tile and the d-pad arms and buttons are
       fatter than the app icon's, because at a 16px tab favicon the app icon's
       proportions put a d-pad arm under half a pixel and it vanishes. Controls are
       even-odd holes, so the tile shows through and the glyph also works as a mask.
       Tile is the chrome token, glyph is the bg token. -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#26242C"/>
  <path transform="rotate(-8 50 50)" fill="#FBF9F4" fill-rule="evenodd"
        d="M25 34 H75 A10 10 0 0 1 85 44 V56 A10 10 0 0 1 75 66 H25 A10 10 0 0 1 15 56 V44 A10 10 0 0 1 25 34 Z
