           M58.8 58 A5.2 5.2 0 1 1 69.2 58 A5.2 5.2 0 1 1 58.8 58 Z
           M68.8 44 A5.2 5.2 0 1 1 79.2 44 A5.2 5.2 0 1 1 68.8 44 Z"/>
</svg>
